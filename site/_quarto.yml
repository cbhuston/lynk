project:
  type: website
  output-dir: _site
  resources:
    - lab/**
  render:
    - index.qmd
    - reports/*.qmd
    - code/*.qmd

website:
  title: "Cooper Huston"
  description: "Cooper Huston: technology for the capital markets, plus quantitative wagering research and the open-source Lynk framework."
  site-url: "https://cbhuston.github.io/lynk/"
  repo-url: "https://github.com/cbhuston/lynk"
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Research
        menu:
          - href: reports/fundamental-model.qmd
            text: "Handicapping Without the Tote"
          - href: reports/multiclass.qmd
            text: "One Race, One Winner"
          - href: reports/bet-sizing.qmd
            text: "Sizing the Bet"
      - text: Code
        menu:
          - href: code/lynk-lab.qmd
            text: "Lynk Lab: 2025 Kentucky Derby AI analyst"
          - href: code/lynk-framework.qmd
            text: "Lynk: quant wagering framework"
          - href: https://github.com/cbhuston/lynk
            text: "Lynk on GitHub"
    right:
      - icon: github
        href: https://github.com/cbhuston
        aria-label: GitHub
  page-footer:
    left: "Cooper Huston"
    right: "Built with [Quarto](https://quarto.org)"

bibliography: references.bib
link-citations: true

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    html-math-method: mathjax
    code-copy: true
    code-overflow: wrap
    fig-cap-location: bottom
    reference-location: margin
    citation-location: document
    smooth-scroll: true
